  </defs>

  <rect width="600" height="360" rx="14" fill="url(#cbBg)" />

  <!-- App Header -->
  <rect x="30" y="25" width="540" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
  <circle cx="52" cy="46" r="5" fill="#EF4444" />
