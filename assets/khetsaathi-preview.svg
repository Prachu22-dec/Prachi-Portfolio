  <circle cx="68" cy="46" r="5" fill="#F59E0B" />
  <circle cx="84" cy="46" r="5" fill="#10B981" />
  <rect x="110" y="36" width="220" height="20" rx="4" fill="#0F172A" />
  <text x="120" y="50" fill="#94A3B8" font-size="11">khetsaathi.app/diagnose</text>
  <rect x="475" y="35" width="80" height="22" rx="4" fill="#10B981" />
  <text x="515" y="50" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">हिन्दी / ENG</text>

  <!-- Left: Leaf Scan Viewfinder -->
  <rect x="30" y="85" width="260" height="245" rx="10" fill="url(#cardGrad)" stroke="#334155" />
  <rect x="50" y="105" width="220" height="150" rx="8" fill="#042F2E" stroke="#10B981" stroke-dasharray="6,4" stroke-width="2" />
  <!-- Leaf icon graphic -->
  <path d="M160 135 C200 135 225 165 220 205 C180 205 155 175 160 135 Z" fill="#10B981" opacity="0.8" />
  <path d="M160 135 L190 205" stroke="#ECFDF5" stroke-width="2" />
  <circle cx="190" cy="170" r="14" fill="none" stroke="#F59E0B" stroke-width="2" />
  <text x="160" y="278" fill="#F8FAFC" font-size="13" font-weight="700" text-anchor="middle">Disease: Early Blight (Tomato)</text>
