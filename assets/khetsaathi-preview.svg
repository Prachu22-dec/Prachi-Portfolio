  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="14" fill="url(#kgGreen)" />

  <!-- App Header Mockup -->
  <rect x="30" y="25" width="540" height="42" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
